plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
    // Requerido por Loom cuando :fabric declara el source set de :common en su
    // bloque `mods` (https://docs.fabricmc.net/develop/loom/classpath-groups)
    id 'net.fabricmc.fabric-loom-companion' version "${fabric_loom_version}"
}

version = rootProject.version
group = rootProject.group

base {
    archivesName = "${mod_id}-common"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        resources.srcDirs = [project.file('src/main/resources'), project.file('src/generated/resources')]
    }
}

neoForge {
    neoFormVersion = neo_form_version
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'NeoForged Releases'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
