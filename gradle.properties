# Gradle Properties
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false
net.minecraftforge.gradle.merge-source-sets=true

# Mod Properties
mod_id=pandoras_creatures
mod_name=Pandoras Creatures Unofficial
mod_license=LGPL-3.0
mod_version=3.1.1
mod_group_id=andrews.pandoras_creatures
mod_authors=andrew0030

# NeoForge/Minecraft Properties
# neo_forge_version se deja sin actualizar a proposito: neoforge no compila en esta
# familia (igual que en release/1.20.1 y release/1.20.2, excluido de
# validateCurrentFamily/validateOfficialLoaders).
minecraft_version=1.20.4
minecraft_version_range=[1.20.4,1.20.5)
neo_forge_version=1.20.1-47.1.106
neo_version_range=[47.1.0,)
loader_version_range=[1,)

# Forge/Minecraft Properties
# forge_version: 49.2.0 ("Recommended") fallaba en runGameTestServer con un
# ResolutionException de modulos JPMS (dos versiones de jline-terminal en conflicto en el
# bootstrap de forge, sin relacion con el codigo del mod). Se prueba 49.2.8 ("Latest" en
# files.minecraftforge.net/net/minecraftforge/forge/index_1.20.4.html) como hipotesis.
forge_version=49.2.0
forge_version_range=[49.2.0,)
forge_loader_version_range=[0,)

# Fabric Properties
# fabric_loader_version 0.19.3 (meta.fabricmc.net/v2/versions/loader/1.20.4, top/stable)
# fabric_api_version: 0.97.3+1.20.4 (ultimo build, jun 2025) causaba ClassFormatError con
# Loom 1.2.7 (mixin de una API mas nueva que el toolchain de compilacion/remap). Se prueba
# 0.91.1+1.20.4 (api.modrinth.com/v2/project/fabric-api/version?game_versions=["1.20.4"],
# primer build publicado, dic 2023, contemporaneo del lanzamiento de 1.20.4).
# fabric_loom_version: sin cambio respecto a 1.20.2 (1.2.7)
fabric_loader_version=0.19.3
fabric_api_version=0.91.1+1.20.4
fabric_loom_version=1.2.7

# Mappings
mapping_channel=official
mapping_version=1.20.4
