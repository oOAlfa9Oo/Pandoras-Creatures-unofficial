# Gradle Properties
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false
net.minecraftforge.gradle.merge-source-sets=true

# Mod Properties
mod_id=pandoras_creatures
mod_name=Pandoras Creatures Unofficial
mod_license=LGPL-3.0
mod_version=3.1.1
mod_group_id=andrews.pandoras_creatures
mod_authors=andrew0030

# NeoForge/Minecraft Properties
# neo_version 20.6.139 = ultimo release estable (no beta) en
# maven.neoforged.net/api/maven/versions/releases/net/neoforged/neoforge. A diferencia de
# 1.20.1/1.20.2/1.20.4, aca NeoForge SI es loader oficial (release estable real), no
# experimental -- ver MULTIVERSION_SUPPORT.md.
minecraft_version=1.20.6
minecraft_version_range=[1.20.6,1.20.7)
neo_version=20.6.139
neo_version_range=[20.6.0,)
loader_version_range=[1,)

# Forge/Minecraft Properties
# forge_version 50.2.0 = build "Recommended" en files.minecraftforge.net/net/minecraftforge/forge/index_1.20.6.html
forge_version=50.2.0
forge_version_range=[50.2.0,)
forge_loader_version_range=[0,)

# Fabric Properties
# fabric_loader_version 0.19.3 (meta.fabricmc.net/v2/versions/loader/1.20.6, top/stable)
# fabric_api_version 0.97.8+1.20.6 (api.modrinth.com/v2/project/fabric-api/version?game_versions=["1.20.6"],
# primer build publicado, abr 2024 -- se prioriza el mas cercano al lanzamiento de 1.20.6
# siguiendo la leccion de 1.20.4 (el build mas reciente choco con el Loom viejo del proyecto).
# fabric_loom_version 1.6.5 (maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/1.6.5) -- MC
# 1.20.5/1.20.6 requieren Loom 1.6+ (confirmado en fabricmc.net/2024/04/19/1205.html); mantener el
# 1.2.7 heredado de 1.20.4 rompia el remapeo de fabric-api con ClassFormatError incluso con el
# build mas viejo de fabric-api para esta version (a diferencia de 1.20.4, donde bajar de version
# de fabric-api alcanzaba).
fabric_loader_version=0.19.3
fabric_api_version=0.97.8+1.20.6
fabric_loom_version=1.6.5

# Mappings
mapping_channel=official
mapping_version=1.20.6
