name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "release/**"
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            command: ./gradlew validateCurrentFamily --console=plain
          - name: fabric
            command: ./gradlew :fabric:build --console=plain
          - name: forge
            command: ./gradlew :forge:build --console=plain
          - name: neoforge
            command: ./gradlew :neoforge:build --console=plain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run ${{ matrix.name }} validation
        run: ${{ matrix.command }}

      - name: Upload ${{ matrix.name }} artifacts
        if: contains(matrix.name, 'fabric') || contains(matrix.name, 'forge') || contains(matrix.name, 'neoforge')
        uses: actions/upload-artifact@v4
        with:
          name: pandoras-creatures-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.name }}/build/libs/*.jar
          if-no-files-found: error
