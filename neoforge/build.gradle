plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = rootProject.version
group = rootProject.group
evaluationDependsOn(':common')
def commonMainSourceSet = project(':common').sourceSets.main

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main {
        java.srcDirs = [project.file('src/main/java')]
        resources.srcDirs = [project.file('src/main/resources'), project.file('src/generated/resources')] + commonMainSourceSet.resources.srcDirs
        compileClasspath += commonMainSourceSet.output
        runtimeClasspath += commonMainSourceSet.output
    }
    test {
        java.srcDirs = [project.file('src/test/java')]
        resources.srcDirs = [project.file('src/test/resources')]
        compileClasspath += commonMainSourceSet.output
        runtimeClasspath += commonMainSourceSet.output
    }
}

sourceSets.main.output.resourcesDir = tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile

tasks.named('processResources', ProcessResources).configure {
    destinationDir = tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDirectory = file("run/${name}")
        }

        client

        server {
            args '--nogui'
        }

        data {
            workingDirectory = file('run/neoforge-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing', rootProject.layout.projectDirectory.dir('common/src/main/resources').asFile.absolutePath,
                    '--existing', rootProject.layout.projectDirectory.dir('common/src/generated/resources').asFile.absolutePath
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'NeoForged Releases'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    minecraft "net.neoforged:forge:${neo_forge_version}"
    implementation project(':common')

    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(':common').sourceSets.main.output)
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_forge_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
