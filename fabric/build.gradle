plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

version = rootProject.version
group = rootProject.group
evaluationDependsOn(':common')
def commonMainSourceSet = project(':common').sourceSets.main
def fabricOnly = providers.gradleProperty('fabricOnly')
        .map { it.toBoolean() }
        .orElse(false)
        .get()

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java.srcDirs = fabricOnly
                ? [project.file('src/main/java'), rootProject.layout.projectDirectory.dir('common/src/main/java').asFile]
                : [project.file('src/main/java')]
        resources.srcDirs = [project.file('src/main/resources')] + commonMainSourceSet.resources.srcDirs
        if (!fabricOnly) {
            compileClasspath += commonMainSourceSet.output
            runtimeClasspath += commonMainSourceSet.output
        }
    }
    test {
        java.srcDirs = [project.file('src/test/java')]
        resources.srcDirs = [project.file('src/test/resources')]
        if (!fabricOnly) {
            compileClasspath += commonMainSourceSet.output
            runtimeClasspath += commonMainSourceSet.output
        }
    }
}

loom {
    mods {
        register(mod_id) {
            if (!fabricOnly) {
                sourceSet commonMainSourceSet
            }
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            runDir = 'run/fabric-client'
        }

        server {
            server()
            runDir = 'run/fabric-server'
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    if (!fabricOnly) {
        implementation project(':common')
    }

    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    if (!fabricOnly) {
        from(project(':common').sourceSets.main.output)
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
