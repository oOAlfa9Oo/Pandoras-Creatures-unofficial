authors="${mod_authors}"
description='''
Unofficial Forge 1.21.1 multiloader port of Pandoras Creatures.

Original project by andrew0030.
Official issue tracker:
https://github.com/andrew0030/Pandoras-Creatures/issues

This loader module currently boots the shared common core and prepares
the project for the staged Forge port.
