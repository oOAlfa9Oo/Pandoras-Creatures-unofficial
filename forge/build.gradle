plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = rootProject.version
group = rootProject.group
evaluationDependsOn(':common')
def commonMainSourceSet = project(':common').sourceSets.main

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        // Consume el output compilado de :common (igual que neoforge/fabric) en vez de
        // reabsorber su fuente. Ver ADR-0008 (backport de ADR-0003 de release/1.20.1).
        // Notas que difieren de 1.20.1 (Forge 52 usa bootstrap JPMS estricto):
        // - common NO va en runtimeClasspath ni como implementation project(':common'):
        //   su jar/clases en el classpath del run colisionan con las clases del mod
        //   (ResolutionException por paquetes exportados dos veces / VerifyError).
        // - El userdev de Forge 52 tampoco une source sets de otro proyecto declarados
        //   en `mods {}`: las clases de common se copian ya compiladas al classes dir
        //   del mod via processResources (abajo).
        java.srcDirs = [project.file('src/main/java')]
        resources.srcDirs = [project.file('src/main/resources'), project.file('src/generated/resources')] + commonMainSourceSet.resources.srcDirs
        compileClasspath += commonMainSourceSet.output
    }
    test {
        java.srcDirs = [project.file('src/test/java')]
        resources.srcDirs = [project.file('src/test/resources')]
        compileClasspath += commonMainSourceSet.output
        runtimeClasspath += commonMainSourceSet.output
    }
}

sourceSets.main.output.resourcesDir = tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile

tasks.named('processResources', ProcessResources).configure {
    destinationDir = tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile
    // Clases de :common (ya compiladas alli) dentro del dir de clases del mod para el
    // dev-run; common se compila una unica vez en :common (objetivo de ADR-0008).
    from(commonMainSourceSet.output.classesDirs)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDirectory = file("run/${name}")
            // Una sola fuente: las clases de common ya estan copiadas (compiladas) en el
            // classes dir de forge. Ver ADR-0008.
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client

        server {
            args '--nogui'
        }

        gameTestServer {
            // Forge 52 filtra los tests comparando esta property contra el NOMBRE del
            // test (prefijado por @GameTestHolder). Sin ella no corre ningun test.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory = file('run/data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing', rootProject.layout.projectDirectory.dir('common/src/main/resources').asFile.absolutePath,
                    '--existing', rootProject.layout.projectDirectory.dir('common/src/generated/resources').asFile.absolutePath
        }
    }
}

repositories {
    mavenLocal()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(':common').sourceSets.main.output)
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
