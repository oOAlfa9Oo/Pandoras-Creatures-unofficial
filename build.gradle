plugins {
    id 'base'
}

version = mod_version
group = mod_group_id

tasks.named('clean') {
    dependsOn ':common:clean', ':neoforge:clean'
}

tasks.named('assemble') {
    dependsOn ':common:assemble', ':neoforge:assemble'
}

tasks.named('check') {
    dependsOn ':common:test', ':neoforge:test'
}

tasks.named('build') {
    dependsOn ':common:build', ':neoforge:build'
}

tasks.register('compileJava') {
    group = 'build'
    description = 'Compiles common and NeoForge Java sources from the workspace root.'
    dependsOn ':common:compileJava', ':neoforge:compileJava'
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs unit tests for common and NeoForge from the workspace root.'
    dependsOn ':common:test', ':neoforge:test'
}

tasks.register('runClient') {
    group = 'moddev'
    description = 'Runs the NeoForge development client from the workspace root.'
    dependsOn ':neoforge:runClient'
}

tasks.register('runServer') {
    group = 'moddev'
    description = 'Runs the NeoForge dedicated server from the workspace root.'
    dependsOn ':neoforge:runServer'
}

tasks.register('runGameTestServer') {
    group = 'verification'
    description = 'Runs the NeoForge GameTest server from the workspace root.'
    dependsOn ':neoforge:runGameTestServer'
}

tasks.register('runData') {
    group = 'moddev'
    description = 'Runs NeoForge data generation from the workspace root.'
    dependsOn ':neoforge:runData'
}
