import groovy.io.FileType

plugins {
    id 'base'
}

version = mod_version
group = mod_group_id

def commonSourceRoots = [
        layout.projectDirectory.dir('common/src/main/java').asFile,
        layout.projectDirectory.dir('common/src/test/java').asFile,
        layout.projectDirectory.dir('gametest/src/main/java').asFile
]

def commonResourceRoots = [
        layout.projectDirectory.dir('common/src/main/resources').asFile,
        layout.projectDirectory.dir('common/src/generated/resources').asFile,
        layout.projectDirectory.dir('common/src/test/resources').asFile,
        layout.projectDirectory.dir('gametest/src/main/resources').asFile
]

def forbiddenLoaderImports = [
        [label: 'NeoForge import', pattern: ~/^\s*import\s+net\.neoforged\./],
        [label: 'Forge import', pattern: ~/^\s*import\s+net\.minecraftforge\./],
        [label: 'Fabric import', pattern: ~/^\s*import\s+net\.fabricmc\./],
        [label: 'ModLauncher import', pattern: ~/^\s*import\s+cpw\.mods\./]
]

def loaderSpecificResourceRules = [
        [label: 'NeoForge mod descriptor', pattern: ~/(^|[\\/])META-INF[\\/]neoforge\.mods\.toml$/],
        [label: 'Forge mod descriptor', pattern: ~/(^|[\\/])META-INF[\\/]mods\.toml$/],
        [label: 'Fabric descriptor', pattern: ~/(^|[\\/])fabric\.mod\.json$/],
        [label: 'NeoForge registry namespace', pattern: ~/(^|[\\/])data[\\/]neoforge([\\/]|$)/],
        [label: 'Loader-specific namespaced data', pattern: ~/(^|[\\/])data[\\/][^\\/]+[\\/]neoforge([\\/]|$)/]
]

tasks.register('verifyArchitecture') {
    group = 'verification'
    description = 'Verifies that common stays free of loader imports and loader-specific resources.'

    doLast {
        def violations = []

        commonSourceRoots.each { root ->
            if (!root.exists()) {
                return
            }

            root.eachFileRecurse(FileType.FILES) { file ->
                if (!file.name.endsWith('.java')) {
                    return
                }

                def lineNumber = 0
                file.eachLine('UTF-8') { line ->
                    lineNumber++
                    forbiddenLoaderImports.each { rule ->
                        if (line ==~ rule.pattern) {
                            violations << "${rule.label} in ${project.relativePath(file)}:${lineNumber}"
                        }
                    }
                }
            }
        }

        commonResourceRoots.each { root ->
            if (!root.exists()) {
                return
            }

            root.eachFileRecurse(FileType.FILES) { file ->
                def normalizedPath = file.absolutePath.replace('\\', '/')
                loaderSpecificResourceRules.each { rule ->
                    if (rule.pattern.matcher(normalizedPath).find()) {
                        violations << "${rule.label} outside neoforge in ${project.relativePath(file)}"
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException("Architecture validation failed:\n - " + violations.join('\n - '))
        }
    }
}

tasks.register('verifyArtifactNaming') {
    group = 'verification'
    description = 'Verifies that loader jars include the loader and Minecraft version in their archive base name.'

    doLast {
        def expectedArchives = [
                fabric  : "${mod_id}-fabric-${minecraft_version}",
                forge   : "${mod_id}-forge-${minecraft_version}",
                neoforge: "${mod_id}-neoforge-${minecraft_version}"
        ]

        expectedArchives.each { projectName, expectedArchive ->
            def actualArchive = project(":${projectName}").base.archivesName.get()
            if (actualArchive != expectedArchive) {
                throw new GradleException("Unexpected archive name for :${projectName}: expected '${expectedArchive}', got '${actualArchive}'")
            }
        }
    }
}

tasks.register('verifyMultiversionDocs') {
    group = 'verification'
    description = 'Verifies that required multiversion planning documents are present.'

    doLast {
        def requiredDocs = [
                'MULTIVERSION_SUPPORT.md',
                'MULTIVERSION_PORTING_CHECKLIST.md',
                'MULTIVERSION_TECHNICAL_MATRIX.md',
                'MULTIVERSION_BRANCH_PLAYBOOK.md',
                'RELEASE_1.21.1_FREEZE.md'
        ]

        def missingDocs = requiredDocs.findAll { !layout.projectDirectory.file(it).asFile.exists() }
        if (!missingDocs.isEmpty()) {
            throw new GradleException("Missing required multiversion docs:\n - " + missingDocs.join('\n - '))
        }
    }
}

tasks.named('clean') {
    dependsOn ':common:clean', ':fabric:clean', ':forge:clean', ':neoforge:clean'
}

tasks.named('assemble') {
    dependsOn ':common:assemble', ':fabric:assemble', ':forge:assemble', ':neoforge:assemble'
}

tasks.named('check') {
    dependsOn ':common:test', ':fabric:test', ':forge:test', ':neoforge:test', 'verifyArchitecture', 'verifyArtifactNaming', 'verifyMultiversionDocs'
}

tasks.named('build') {
    dependsOn ':common:build', ':fabric:build', ':forge:build', ':neoforge:build'
}

tasks.register('compileJava') {
    group = 'build'
    description = 'Compiles common, Fabric, Forge and NeoForge Java sources from the workspace root.'
    dependsOn ':common:compileJava', ':fabric:compileJava', ':forge:compileJava', ':neoforge:compileJava'
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs unit tests for common, Fabric, Forge and NeoForge from the workspace root.'
    dependsOn 'verifyArchitecture', 'verifyArtifactNaming', 'verifyMultiversionDocs', ':common:test', ':fabric:test', ':forge:test', ':neoforge:test'
}

tasks.register('runClient') {
    group = 'moddev'
    description = 'Runs the NeoForge development client from the workspace root.'
    dependsOn ':neoforge:runClient'
}

tasks.register('runFabricClient') {
    group = 'moddev'
    description = 'Runs the Fabric development client from the workspace root.'
    dependsOn ':fabric:runClient'
}

tasks.register('runForgeClient') {
    group = 'moddev'
    description = 'Runs the Forge development client from the workspace root.'
    dependsOn ':forge:runClient'
}

tasks.register('runServer') {
    group = 'moddev'
    description = 'Runs the NeoForge dedicated server from the workspace root.'
    dependsOn ':neoforge:runServer'
}

tasks.register('runFabricServer') {
    group = 'moddev'
    description = 'Runs the Fabric dedicated server from the workspace root.'
    dependsOn ':fabric:runServer'
}

tasks.register('runForgeServer') {
    group = 'moddev'
    description = 'Runs the Forge dedicated server from the workspace root.'
    dependsOn ':forge:runServer'
}

tasks.register('runGameTestServer') {
    group = 'verification'
    description = 'Runs the shared GameTest catalog on Fabric, Forge and NeoForge.'
    dependsOn ':fabric:runGameTestServer', ':forge:runGameTestServer', ':neoforge:runGameTestServer'
}

tasks.register('runData') {
    group = 'moddev'
    description = 'Runs NeoForge data generation from the workspace root.'
    dependsOn ':neoforge:runData'
}

tasks.register('buildLoaderJars') {
    group = 'build'
    description = 'Builds distributable jars for all loaders in the current Minecraft family.'
    dependsOn ':fabric:build', ':forge:build', ':neoforge:build'
}

tasks.register('validateCurrentFamily') {
    group = 'verification'
    description = 'Runs the minimum validation gate before freezing the current Minecraft family branch.'
    dependsOn 'compileJava', 'test', 'verifyArtifactNaming', 'verifyMultiversionDocs', 'buildLoaderJars', 'runGameTestServer'
}
